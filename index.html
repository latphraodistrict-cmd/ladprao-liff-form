<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ยื่นเอกสารอุทกภัย ๒๕๖๙ LINE OA สำนักงานเขตลาดพร้าว</title>
    <!-- นำเข้า Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้า Google Fonts: Sarabun (ฟอนต์ภาษาไทยแบบมีหัว อ่านง่าย) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- นำเข้า LINE LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- นำเข้า Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: 'Sarabun', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-3 sm:p-6">
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
        
        <!-- ส่วนหัวของฟอร์ม -->
        <div class="bg-gradient-to-r from-blue-700 to-indigo-800 p-5 text-white text-center">
            <h2 class="text-2xl font-bold tracking-wide">ระบบยื่นเอกสารอุทกภัยเพิ่มเติม</h2>
            <p class="text-blue-100 text-sm mt-1 font-light">LINE Official Account สำนักงานเขตลาดพร้าว</p>
        </div>

        <form id="docForm" class="p-5 space-y-5">
            
            <!-- เลขบัตรประชาชน -->
            <div>
                <label class="block text-base font-semibold text-slate-800 mb-1">
                    1. เลขบัตรประชาชน (13 หลัก) <span class="text-red-500">*</span>
                </label>
                <input type="text" id="national_id" maxlength="13" required 
                    class="w-full p-3 text-lg border-2 border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition text-slate-800 placeholder-slate-400"
                    placeholder="กรอกเลขบัตรประชาชน 13 หลัก">
                <p id="searchStatus" class="text-sm font-medium mt-1.5"></p>
            </div>

            <!-- ชื่อ-นามสกุล -->
            <div>
                <label class="block text-base font-semibold text-slate-800 mb-1">
                    2. ชื่อ - นามสกุล <span class="text-red-500">*</span>
                </label>
                <input type="text" id="full_name" required 
                    class="w-full p-3 text-base border-2 border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition text-slate-800"
                    placeholder="ระบุชื่อและนามสกุลจริง">
            </div>

            <!-- เบอร์โทรศัพท์ -->
            <div>
                <label class="block text-base font-semibold text-slate-800 mb-1">
                    3. เบอร์โทรศัพท์ติดต่อ <span class="text-red-500">*</span>
                </label>
                <input type="tel" id="phone_number" maxlength="10" required 
                    class="w-full p-3 text-base border-2 border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition text-slate-800"
                    placeholder="เช่น 0812345678">
            </div>

            <!-- สถานะ -->
            <div>
                <label class="block text-base font-semibold text-slate-800 mb-1">
                    4. สถานะของคุณ <span class="text-red-500">*</span>
                </label>
                <select id="house_status" required 
                    class="w-full p-3 text-base border-2 border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none bg-white transition text-slate-800">
                    <option value="">-- กดเพื่อเลือกสถานะ --</option>
                    <option value="เจ้าบ้าน">เจ้าบ้าน</option>
                    <option value="ผู้เช่า">ผู้เช่า</option>
                    <option value="ลูกบ้าน">ลูกบ้าน</option>
                </select>
            </div>

            <!-- แนบไฟล์เอกสาร -->
            <div>
                <label class="block text-base font-semibold text-slate-800 mb-1">
                    5. แนบรูปถ่าย หรือ เอกสาร PDF <span class="text-red-500">*</span>
                </label>
                
                <input type="file" id="document_file" accept="image/*,.pdf" multiple class="hidden">
                
                <button type="button" onclick="document.getElementById('document_file').click()"
                    class="w-full bg-blue-50 hover:bg-blue-100 border-2 border-dashed border-blue-400 rounded-2xl p-5 text-center transition flex flex-col items-center justify-center gap-2 group active:scale-98">
                    <div class="w-12 h-12 bg-blue-600 text-white rounded-full flex items-center justify-center text-xl shadow-md group-hover:scale-110 transition">
                        📷
                    </div>
                    <span class="text-lg font-bold text-blue-900">
                        กดตรงนี้เพื่อ "เลือกรูปภาพ" หรือ "ไฟล์ PDF"
                    </span>
                    <span class="text-sm text-slate-600">
                        (สามารถเลือกได้หลายๆ รูปพร้อมกัน)
                    </span>
                </button>

                <!-- สรุปจำนวนไฟล์ที่เลือก -->
                <div class="mt-3 text-center">
                    <p id="fileCount" class="text-sm text-slate-500 font-medium">ยังไม่ได้เลือกไฟล์เอกสาร</p>
                </div>

                <!-- แสดงรายการ/ตารางไฟล์ที่เลือกพร้อมปุ่มดูตัวอย่าง -->
                <div id="fileListPreview" class="mt-3 space-y-2 hidden">
                    <p class="text-sm font-semibold text-slate-700">รายการเอกสารที่เตรียมส่ง:</p>
                    <div id="fileItemsContainer" class="space-y-2">
                        <!-- รายการไฟล์จะถูกเติมเข้ามาด้วย JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Hidden Fields -->
            <input type="hidden" id="line_user_id">
            <input type="hidden" id="drive_folder_id">

            <!-- ปุ่มกดส่งข้อมูล -->
            <div class="pt-2">
                <button type="submit" id="submitBtn"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white p-4 rounded-xl font-bold text-xl shadow-lg transition duration-200 transform">
                    ส่งข้อมูลและอัปโหลดเอกสาร
                </button>
            </div>

        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://wvbhjagexbjpyuipbpnx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_OPzVGkJk8VeN2-xlzIdaog_FT1rJIQq';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentLineId = '';
        let selectedFilesArray = []; // ตัวแปรเก็บไฟล์ทั้งหมดที่เลือกไว้

        window.onload = async function() {
            try {
                await liff.init({ liffId: "2012104123-sCwmwCsF" });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    currentLineId = profile.userId;
                    document.getElementById('line_user_id').value = currentLineId;
                } else {
                    liff.login();
                }
            } catch (error) {
                console.error("LIFF Initialization failed", error);
            }
        };

        // จัดการเมื่อมีการเลือกไฟล์เพิ่ม
        document.getElementById('document_file').addEventListener('change', function(e) {
            const newFiles = Array.from(e.target.files);
            selectedFilesArray = selectedFilesArray.concat(newFiles); // รวมไฟล์ใหม่เข้ากับไฟล์เดิม
            renderFileList();
            e.target.value = ''; // ล้างค่า input เพื่อให้เลือกไฟล์เดิมซ้ำได้ถ้าต้องการ
        });

        // ฟังก์ชันวาดรายการไฟล์พร้อมปุ่มดูตัวอย่าง
        function renderFileList() {
            const fileCountText = document.getElementById('fileCount');
            const fileListPreview = document.getElementById('fileListPreview');
            const container = document.getElementById('fileItemsContainer');

            container.innerHTML = '';

            if (selectedFilesArray.length > 0) {
                fileCountText.innerHTML = `<span class="bg-green-100 text-green-800 px-3 py-1.5 rounded-lg text-base border border-green-300 inline-block font-bold">✓ คุณเลือกเอกสารแล้วทั้งหมด ${selectedFilesArray.length} ไฟล์</span>`;
                fileListPreview.classList.remove('hidden');

                selectedFilesArray.forEach((file, index) => {
                    const fileUrl = URL.createObjectURL(file);
                    const itemDiv = document.createElement('div');
                    itemDiv.className = "flex items-center justify-between p-3 bg-slate-50 border border-slate-200 rounded-xl";

                    const isImage = file.type.startsWith('image/');
                    const icon = isImage ? '🖼️' : '📄';

                    itemDiv.innerHTML = `
                        <div class="flex items-center gap-2 overflow-hidden mr-2">
                            <span class="text-xl">${icon}</span>
                            <div class="truncate">
                                <p class="text-sm font-semibold text-slate-800 truncate">${file.name}</p>
                                <p class="text-xs text-slate-500">${(file.size / 1024).toFixed(1)} KB</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            <a href="${fileUrl}" target="_blank" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-2.5 py-1.5 rounded-lg text-xs font-bold transition">
                                👁️ ดูตัวอย่าง
                            </a>
                            <button type="button" onclick="removeFile(${index})" class="bg-red-100 hover:bg-red-200 text-red-600 p-1.5 rounded-lg text-xs font-bold transition">
                                ✕
                            </button>
                        </div>
                    `;
                    container.appendChild(itemDiv);
                });
            } else {
                fileCountText.innerText = "ยังไม่ได้เลือกไฟล์เอกสาร";
                fileCountText.className = "text-sm text-slate-500 font-medium";
                fileListPreview.classList.add('hidden');
            }
        }

        // ฟังก์ชันลบไฟล์ออกจากรายการ
        function removeFile(index) {
            selectedFilesArray.splice(index, 1);
            renderFileList();
        }

        // ตรวจสอบเลขบัตรประชาชน 13 หลัก (Autofill)
        document.getElementById('national_id').addEventListener('input', async function(e) {
            const id13 = e.target.value.trim();
            const statusText = document.getElementById('searchStatus');

            if (id13.length === 13) {
                statusText.innerText = "🔍 กำลังตรวจสอบข้อมูลเดิม...";
                statusText.className = "text-sm font-medium text-blue-600 mt-1.5";

                const { data, error } = await supabase
                    .from('citizens')
                    .select('*')
                    .eq('national_id', id13)
                    .single();

                if (data) {
                    document.getElementById('full_name').value = data.full_name;
                    document.getElementById('phone_number').value = data.phone_number;
                    document.getElementById('house_status').value = data.house_status;
                    document.getElementById('drive_folder_id').value = data.drive_folder_id || '';
                    statusText.innerText = "✓ พบข้อมูลเดิมของท่านเรียบร้อยแล้ว (เอกสารใหม่จะถูกเพิ่มเข้าโฟลเดอร์เดิม)";
                    statusText.className = "text-sm text-emerald-700 bg-emerald-50 p-2 rounded-lg border border-emerald-200 mt-1.5 font-semibold";
                } else {
                    document.getElementById('full_name').value = '';
                    document.getElementById('phone_number').value = '';
                    document.getElementById('house_status').selectedIndex = 0;
                    document.getElementById('drive_folder_id').value = '';
                    statusText.innerText = "+ ไม่พบข้อมูลเดิม (ระบบจะสร้างโฟลเดอร์ข้อมูลใหม่ให้ท่าน)";
                    statusText.className = "text-sm text-amber-700 bg-amber-50 p-2 rounded-lg border border-amber-200 mt-1.5 font-semibold";
                }
            } else {
                statusText.innerText = "";
            }
        });

        // จัดการเมื่อกดปุ่มส่งฟอร์ม
        document.getElementById('docForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');

            if (selectedFilesArray.length === 0) {
                alert("กรุณากดเลือกไฟล์รูปภาพหรือ PDF อย่างน้อย 1 ไฟล์ครับ");
                return;
            }

            btn.disabled = true;
            btn.innerText = `⏳ กำลังอัปโหลดทั้ง ${selectedFilesArray.length} ไฟล์...`;
            btn.className = "w-full bg-slate-400 text-white p-4 rounded-xl font-bold text-xl cursor-not-allowed";

            const fileToBase64 = file => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve({
                    name: file.name,
                    type: file.type,
                    base64: reader.result.split(',')[1]
                });
                reader.onerror = error => reject(error);
            });

            try {
                const filePromises = selectedFilesArray.map(file => fileToBase64(file));
                const encodedFiles = await Promise.all(filePromises);

                const payload = {
                    national_id: document.getElementById('national_id').value.trim(),
                    full_name: document.getElementById('full_name').value.trim(),
                    phone_number: document.getElementById('phone_number').value.trim(),
                    house_status: document.getElementById('house_status').value,
                    line_user_id: document.getElementById('line_user_id').value,
                    drive_folder_id: document.getElementById('drive_folder_id').value,
                    files: encodedFiles
                };

                const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzaueeD0CojOZSd55pOkw6wVuzXTYPb6Qf_4D4TDhuhc4fAlG8om3of6DZud0l37HaWjg/exec';

                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    contentType: 'application/json',
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.status === "success") {
                    alert("✓ ส่งข้อมูลและอัปโหลดเอกสารทั้งหมดสำเร็จเรียบร้อยแล้ว!");
                    if (typeof liff !== 'undefined' && liff.isInClient()) {
                        liff.closeWindow();
                    }
                } else {
                    alert("เกิดข้อผิดพลาด: " + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อระบบ กรุณาลองใหม่อีกครั้ง");
            } finally {
                btn.disabled = false;
                btn.innerText = "ส่งข้อมูลและอัปโหลดเอกสาร";
                btn.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white p-4 rounded-xl font-bold text-xl shadow-lg transition duration-200";
            }
        });
    </script>
</body>
</html>
